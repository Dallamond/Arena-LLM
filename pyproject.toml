[project]
name = "arena-llm"
version = "0.1.0"
description = "Banco de pruebas independiente del hardware para modelos de IA locales (llama.cpp)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Bancos de preguntas y problemas: texto en español en una línea por entrada
"server/quality/datasets.py" = ["E501"]
# Script de auditoría puntual: rutas y selectores largos
"scripts/a11y.py" = ["E501"]
