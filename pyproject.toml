[project]
name = "arena-llm"
version = "0.1.0"
description = "Banco de pruebas independiente del hardware para modelos de IA locales (llama.cpp)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
